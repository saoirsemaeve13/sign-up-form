<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="javascript.js" defer></script>
    <link
      rel="preload"
      href="./assets/fascinate-inline-v24-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <header>
      <h1>Saturnalia</h1>
      <p class="img-credit">
        Photo by
        <a
          href="https://unsplash.com/@aronvisuals?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Aron Visuals</a
        >
        on
        <a
          href="https://unsplash.com/photos/a-purple-and-blue-spiral-shaped-object-with-stars-in-the-background-GdP2aN8GS7k?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Unsplash</a
        >
      </p>
    </header>
    <main>
      <div class="information">
        <p>
          This isn't a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </div>
      <div class="signup">
        <h3>Let's do this!</h3>
        <form>
          <label>First Name</label>
          <label>Last Name</label>
          <label>Email</label>
          <label>Phone Number</label>
          <label>Password</label>
          <label>Confirm Password</label>
        </form>
      </div>
      <div class="footer">
        <button>Create Account</button>
        <p>
          Already have an account? <a href="link.html">Click here to login.</a>
        </p>
      </div>
    </main>
  </body>
</html>
