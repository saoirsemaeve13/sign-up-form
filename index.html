<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="javascript.js" defer></script>
    <link
      rel="preload"
      href="./assets/fascinate-inline-v24-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <h1>Saturnalia</h1>
        <img src="./assets/planet_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" />
      </div>
    </header>
    <main>
      <div class="information">
        <p>
          This isn't a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </div>
      <div class="signup">
        <h3>Let's do this!</h3>
        <form>
          <label>First Name</label>
          <label>Last Name</label>
          <label>Email</label>
          <label>Phone Number</label>
          <label>Password</label>
          <label>Confirm Password</label>
        </form>
      </div>
      <div class="footer">
        <button>Create Account</button>
        <p>
          Already have an account? <a href="link.html">Click here to login.</a>
        </p>
      </div>
    </main>
  </body>
</html>
